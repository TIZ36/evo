# Load after the Harness LLM and system-prompt services.
- id: evo
  name: evo/cordis
  config: {}

- id: evo-deepseek
  name: evo/deepseek
  config:
    # Must match a provider/model route already registered in DeepSeek Harness.
    provider: deepseek-official
    model: deepseek-chat
    recallLimit: 40
    maxContextChars: 6000
    reflect: true

# Optional web client carrier: bare package name so dsh-client-modules
# discovers the dsh.client bundle and serves the Settings → Memory panel.
- id: evo-web
  name: evo
  config: {}
