# evo DeepSeek Harness bundle. Installed profiles apply this layer after
# their existing bundles and before the user's cordis.patch.yml overrides.
- insert:
    - id: evo
      name: "@tiz36/evo/cordis"
      config: {}

    - id: evo-deepseek
      name: "@tiz36/evo/deepseek"
      config:
        provider: !!js process.env.EVO_PROVIDER?.trim() || process.env.EVO_MEMORY_PROVIDER?.trim() || 'deepseek-official'
        model: !!js process.env.EVO_MODEL?.trim() || process.env.EVO_MEMORY_MODEL?.trim() || 'deepseek-v4-flash'
        recallLimit: 40
        maxContextChars: 6000
        reflect: true

    # Web client carrier: a no-op host row named by the package itself so the
    # dsh-client-modules scan discovers evo's dsh.client bundle and
    # serves it as /plugins/@tiz36/evo/client.js (subpath names cannot resolve
    # <name>/package.json and would never be discovered).
    - id: evo-web
      name: "@tiz36/evo"
      config: {}
